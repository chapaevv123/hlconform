[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hlconform"
version = "0.1.0"
description = "Read-only HIP-3 conformance vectors and metadata drift diagnostics"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
hlconform = "hlconform.__main__:main"

[tool.setuptools.packages.find]
include = ["hlconform*"]
